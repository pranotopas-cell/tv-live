        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; background: var(--bg-airport); color: var(--text-white-soft); 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
        }

        /* HEADER */
        .header {
            background: var(--header-bg); padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--text-gold-soft); flex-shrink: 0; z-index: 500;
        }
        .header h1 { margin: 0; font-size: 26px; letter-spacing: 2px; }
        #clock { font-size: 24px; font-weight: 800; color: var(--text-white-soft); }

        /* MAIN CONTENT */
        .main-content { flex: 1; overflow-y: auto; position: relative; scroll-behavior: smooth; }
        /* Hilangkan scrollbar tapi tetap bisa scroll */
        .main-content::-webkit-scrollbar { display: none; }

        /* QUOTE OVERLAY */
        #quoteOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(10,15,29,0.98) 0%, #050811 100%);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; z-index: 2000; backdrop-filter: blur(20px);
            opacity: 0; transition: opacity 1s ease;
        }
        .quote-text { font-size: 38px; font-weight: 300; font-style: italic; max-width: 80%; margin-bottom: 30px; line-height: 1.5; }
        .quote-source { font-size: 18px; color: var(--text-gold-soft); letter-spacing: 5px; text-transform: uppercase; border-top: 1px solid rgba(229,192,123,0.3); padding-top: 15px; }

        /* TABLE */
        table { width: 100%; border-collapse: collapse; transition: all 1s ease; }
        th { background: var(--header-bg); color: var(--text-gold-soft); padding: 15px; position: sticky; top: 0; z-index: 100; text-align: left; border-bottom: 1px solid var(--border-blue); }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .date-divider { background: #1a2235; color: var(--text-gold-soft); text-align: center; font-weight: bold; padding: 10px; letter-spacing: 3px; }
        .nopol-block { background: #e2e8f0; color: #1e293b; padding: 4px 8px; border-radius: 4px; font-weight: 800; display: inline-block; }
        .sopir-name { color: var(--text-blue-soft); font-weight: 700; margin-left: 10px; }

        /* ANIMATION */
        .letter { display: inline-block; opacity: 0; transform: translateY(20px); transition: all 0.5s ease; }
        .letter.in { opacity: 1; transform: translateY(0); }

        .footer-marquee { position: fixed; bottom: 0; width: 100%; background: #000; color: #fff; height: 35px; line-height: 35px; border-top: 1px solid var(--text-gold-soft); }
    </style>

        let quoteIndex = 0;
        let scrollInterval;
        const container = document.getElementById('scrollContainer');

        function wrapText(el) {
            const txt = el.innerText;
            el.innerHTML = txt.split('').map(char => `<span class="letter">${char === ' ' ? '&nbsp;' : char}</span>`).join('');
        }

        async function showQuote() {
            return new Promise(async (resolve) => {
                const overlay = document.getElementById('quoteOverlay');
                const qTxt = document.getElementById('quoteText');
                const qSrc = document.getElementById('quoteSource');
                const table = document.getElementById('deliveryTable');

                // 1. Sembunyikan Tabel
                table.style.opacity = "0";
                table.style.transform = "scale(0.95)";

                // 2. Siapkan Quote
                const q = quotes[quoteIndex];
                quoteIndex = (quoteIndex + 1) % quotes.length;
                qTxt.innerText = q.t;
                qSrc.innerText = q.s;
                wrapText(qTxt);
                
                overlay.style.display = 'flex';
                setTimeout(() => overlay.style.opacity = '1', 50);

                // 3. Animasi Huruf
                const letters = qTxt.querySelectorAll('.letter');
                for(let i=0; i<letters.length; i++) {
                    setTimeout(() => letters[i].classList.add('in'), i * 30);
                }

                // 4. Tunggu sebentar lalu tutup
                setTimeout(() => {
                    overlay.style.opacity = '0';
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        table.style.opacity = "1";
                        table.style.transform = "scale(1)";
                        resolve();
                    }, 1000);
                }, 7000);
            });
        }

        function startAutoScroll() {
            clearInterval(scrollInterval);
            container.scrollTop = 0;
            
            // Tunggu 3 detik sebelum mulai scroll
            setTimeout(() => {
                scrollInterval = setInterval(async () => {
                    container.scrollTop += 1;
                    
                    // Cek jika sudah sampai bawah
                    if (Math.ceil(container.scrollTop + container.clientHeight) >= container.scrollHeight) {
                        clearInterval(scrollInterval);
                        await new Promise(r => setTimeout(r, 2000));
                        await showQuote();
                        loadDashboard(); // Refresh data setelah quote
                    }
                }, 50); 
            }, 3000);
        }

        async function loadDashboard() {
            try {
                const now = new Date();
                const tgl = now.toISOString().split('T')[0];
                document.getElementById('targetDate').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();

                const { data, error } = await _supabase.from('data_pengiriman').select('*').gte('tanggal', tgl);
                if (error) throw error;

                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:50px;">TIDAK ADA JADWAL PENGIRIMAN HARI INI</td></tr>';
                    // Jika tidak ada data, tetap tampilkan quote secara berkala
                    setTimeout(async () => { await showQuote(); loadDashboard(); }, 10000);
                    return;
                }

                data.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            <span class="nopol-block">${row.nopol || '-'}</span>
                            <span class="sopir-name">${row.sopir || '-'}</span><br>
                            <small style="color:var(--text-gold-soft)">📍 ${row.lokasi || '-'}</small>
                        </td>
                        <td style="text-align:center; font-weight:bold;">${row.jumlah_keluar || 0}</td>
                        <td>${row.delivery_to || '-'}<br><small>${row.supplier || '-'}</small></td>
                        <td style="text-align:right; font-weight:bold; color:var(--color-proses)">${(row.status || 'TERJADWAL').toUpperCase()}</td>
                    `;
                    tbody.appendChild(tr);
                });

                startAutoScroll();
            } catch (e) {
                console.error(e);
            }
        }

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID');
        }, 1000);

        loadDashboard();
    </script>
</body>
</html>
