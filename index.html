<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Live - Investama Kalimantan Energi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151c2e;
            --text-gold: #f3ba2f;
            --text-white: #ffffff;
            --text-white-soft: #cbd5e1;
            --text-blue-soft: #38bdf8;
            --border-color: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-main); color: var(--text-white); font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        #tvAudioModal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(11,15,25,0.98); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        #btnEnableTV { padding: 18px 45px; font-size: 22px; font-weight: bold; background: var(--text-gold); border: none; border-radius: 8px; cursor: pointer; }
        header { background-color: var(--bg-card); border-bottom: 2px solid var(--border-color); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .clock-time { font-size: 26px; font-weight: bold; color: var(--text-gold); font-family: monospace; }
        #scrollContainer { flex: 1; overflow-y: auto; padding: 20px 25px; }
        table { width: 100%; border-collapse: collapse; }
        th { background-color: var(--bg-card); color: var(--text-white-soft); padding: 12px; text-align: left; }
        td { padding: 14px; border-bottom: 1px solid var(--border-color); }
        .nopol-block { background-color: var(--text-gold); color: #000; font-weight: bold; padding: 3px 8px; border-radius: 4px; display: inline-block; }
    </style>
</head>
<body>

    <div id="tvAudioModal">
        <h2 style="color:var(--text-gold); margin-bottom: 20px;">KLIK UNTUK AKTIFKAN SUARA TV</h2>
        <button id="btnEnableTV">TEKAN OK / ENTER</button>
    </div>

    <header>
        <div>
            <h1 style="color:var(--text-gold); font-size: 20px;">DASHBOARD PENGIRIMAN INVESTAMA</h1>
            <p id="targetDate">MENGAMBIL DATA...</p>
        </div>
        <div class="clock-time" id="clock">00:00:00</div>
    </header>

    <div id="scrollContainer">
        <table>
            <thead>
                <tr>
                    <th>Unit / Sopir / Lokasi</th>
                    <th style="text-align: center;">Jumlah</th>
                    <th>Tujuan / Depo</th>
                    <th style="text-align: right;">Status</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- Audio Element untuk Play Audio Stream -->
    <audio id="globalAudioPlayer" preload="auto"></audio>

    <script>
        const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let previousStatusMap = {};
        let isInitialLoad = true;
        let isAudioAllowed = false;

        // FUNGSI SUARA DENGAN MULTI-FALLBACK ENGINE
        function speakText(text) {
            if (!isAudioAllowed) return;

            // CARA 1: Coba Web Speech API Native Browser
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'id-ID';
                utter.rate = 0.9;
                
                let hasSpoken = false;
                utter.onstart = () => { hasSpoken = true; };
                window.speechSynthesis.speak(utter);

                // Jika dalam 1 detik Web Speech API gagal/diblokir TV, switch ke CARA 2
                setTimeout(() => {
                    if (!hasSpoken) {
                        playFromExternalServer(text);
                    }
                }, 800);
            } else {
                playFromExternalServer(text);
            }
        }

        // CARA 2: Stream Audio Server yang Tidak Diblokir Android TV
        function playFromExternalServer(text) {
            const player = document.getElementById('globalAudioPlayer');
            const cleanText = encodeURIComponent(text);
            
            // Menggunakan Service API TTS yang mendukung Android TV Bro
            const audioUrl = `https://api.voicerss.org/?key=e16104c99c514800a74d53df70cdd6ea&hl=id-id&src=${cleanText}&c=MP3`;

            player.src = audioUrl;
            player.play().catch(e => {
                console.log("Error play audio: ", e);
            });
        }

        document.getElementById('btnEnableTV').addEventListener('click', function() {
            isAudioAllowed = true;
            document.getElementById('tvAudioModal').style.display = 'none';
            speakText("Sistem pengumuman audio telah aktif.");
        });

        function getWIBDateString() {
            const d = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Jakarta" }));
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function announceStatusChange(item, statusType) {
            const nopol = item.nopol || 'Tanpa Nopol';
            const sopir = item.sopir || 'Sopir';
            const tujuan = item.delivery_to || 'Tujuan';

            let teks = "";
            if (statusType.includes("PROSES")) {
                teks = `Perhatian, armada ${nopol}, driver ${sopir}, tujuan ${tujuan}, status PROSES.`;
            } else if (statusType.includes("DELIVERED")) {
                teks = `Perhatian, armada ${nopol}, driver ${sopir}, tujuan ${tujuan}, status DELIVERED.`;
            }

            if (teks) speakText(teks);
        }

        async function loadDashboard() {
            try {
                const isoHariIni = getWIBDateString();
                document.getElementById('targetDate').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();

                const { data, error } = await _supabase.from('data_pengiriman').select('*').gte('tanggal', isoHariIni);
                if (error) throw error;

                (data || []).forEach(item => {
                    const id = item.id || (item.sopir + '_' + item.tanggal + '_' + item.delivery_to);
                    const statusBaru = (item.status || "").toUpperCase();

                    if (!isInitialLoad && item.tanggal === isoHariIni) {
                        const statusLama = previousStatusMap[id];
                        if (statusBaru.includes("PROSES") && statusLama && !statusLama.includes("PROSES")) {
                            announceStatusChange(item, "PROSES");
                        } else if (statusBaru.includes("DELIVERED") && statusLama && !statusLama.includes("DELIVERED")) {
                            announceStatusChange(item, "DELIVERED");
                        }
                    }
                    previousStatusMap[id] = statusBaru;
                });

                isInitialLoad = false;
                renderData(data || []);
            } catch (err) { console.error(err); }
        }

        function renderData(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <span class="nopol-block">${row.nopol || '-'}</span> <b>${row.sopir || '-'}</b>
                        <div style="font-size:12px; color:var(--text-blue-soft);">${row.lokasi || '-'}</div>
                    </td>
                    <td style="text-align:center;">${row.jumlah_keluar || '0'}</td>
                    <td><b>${row.delivery_to || '-'}</b></td>
                    <td style="text-align:right; font-weight:bold; color:var(--text-gold);">${row.status || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta' });
        }, 1000);

        loadDashboard();
        
        _supabase.channel('realtime_pengiriman').on('postgres_changes', { event: '*', schema: 'public', table: 'data_pengiriman' }, () => {
            loadDashboard();
        }).subscribe();
    </script>
</body>
</html>
