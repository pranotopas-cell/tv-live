<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Live - Investama Kalimantan Energi</title>
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- ResponsiveVoice API (Paling Stabil untuk Smart TV) -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=free"></script>

    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151c2e;
            --text-gold: #f3ba2f;
            --text-gold-soft: #d1a638;
            --text-white: #ffffff;
            --text-white-soft: #cbd5e1;
            --text-blue-soft: #38bdf8;
            --border-color: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-main); color: var(--text-white); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* Modal Overlay */
        #tvAudioModal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(11, 15, 25, 0.98); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; text-align: center; padding: 20px;
        }
        #tvAudioModal h2 { color: var(--text-gold); margin-bottom: 15px; font-size: 28px; letter-spacing: 1px; }
        #tvAudioModal p { color: var(--text-white-soft); margin-bottom: 30px; font-size: 18px; max-width: 600px; line-height: 1.5; }
        #btnEnableTV {
            padding: 16px 40px; font-size: 20px; font-weight: bold; background: var(--text-gold);
            color: #000; border: none; border-radius: 8px; cursor: pointer; outline: 3px solid #ffffff;
        }
        #btnEnableTV:focus, #btnEnableTV:hover { transform: scale(1.05); background: #ffffff; color: #000; }

        /* Header Layout */
        header {
            background-color: var(--bg-card); border-bottom: 2px solid var(--border-color);
            padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }
        .header-title h1 { color: var(--text-gold); font-size: 24px; letter-spacing: 1px; text-transform: uppercase; }
        .header-title p { color: var(--text-white-soft); font-size: 14px; margin-top: 4px; }
        .header-controls { display: flex; align-items: center; gap: 20px; }
        .clock-block { text-align: right; }
        .clock-time { font-size: 26px; font-weight: bold; color: var(--text-gold); font-family: monospace; }
        .audio-control { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border-color); }
        .audio-btn { background: var(--text-gold); border: none; color: #000; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }

        /* Scroll Area & Table */
        #scrollContainer { flex: 1; overflow-y: auto; padding: 20px 25px; scroll-behavior: smooth; }
        #scrollContainer::-webkit-scrollbar { display: none; }
        #scrollContainer { -ms-overflow-style: none; scrollbar-width: none; }
        table { width: 100%; border-collapse: collapse; }
        th { background-color: var(--bg-card); color: var(--text-white-soft); text-transform: uppercase; font-size: 13px; letter-spacing: 1px; padding: 12px 16px; text-align: left; position: sticky; top: 0; z-index: 5; border-bottom: 2px solid var(--border-color); }
        td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        tr:nth-child(even) { background-color: rgba(255, 255, 255, 0.02); }
        .date-divider { background-color: #1e293b; color: var(--text-gold); font-weight: bold; font-size: 14px; letter-spacing: 1px; padding: 8px 16px; border-left: 4px solid var(--text-gold); }
        .flight-cell { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
        .nopol-block { background-color: var(--text-gold); color: #000; font-weight: bold; padding: 3px 8px; border-radius: 4px; font-size: 14px; }
        .sopir-name { font-weight: bold; font-size: 16px; color: var(--text-white); }

        /* Status Colors */
        .st-proses { color: #f59e0b; }
        .st-langsir { color: #3b82f6; }
        .st-terjadwal { color: #94a3b8; }
        .st-oper { color: #a855f7; }
        .st-tunggu { color: #ef4444; }
        .st-ngisi { color: #06b6d4; }
        .st-delivered { color: #10b981; }

        /* Quote Overlay */
        #quoteOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(11, 15, 25, 0.96); display: none; flex-direction: column; justify-content: center; align-items: center; padding: 40px; text-align: center; z-index: 100; opacity: 0; transition: opacity 0.8s ease; }
        .quote-box { max-width: 800px; }
        #quoteText { font-size: 28px; line-height: 1.6; color: var(--text-white); margin-bottom: 20px; font-style: italic; }
        #quoteSource { font-size: 20px; color: var(--text-gold); font-weight: bold; }
        .word-wrapper { display: inline-block; white-space: nowrap; margin-right: 8px; }
        .letter-wrapper { display: inline-block; overflow: hidden; vertical-align: bottom; }
        .letter { display: inline-block; transform: translateY(100%); opacity: 0; transition: transform 0.4s cubic-bezier(0.1, 0.7, 0.1, 1), opacity 0.4s ease; }
        .letter.in { transform: translateY(0%); opacity: 1; }
        .letter.out { transform: translateY(-100%); opacity: 0; }
    </style>
</head>
<body>

    <!-- Modal Aktivasi TV -->
    <div id="tvAudioModal">
        <h2>SISTEM PENGUMUMAN SUARA DASHBOARD</h2>
        <p>Silakan tekan tombol <b style="color: var(--text-gold);">OK / ENTER</b> pada Remote TV Anda untuk menguji suara.</p>
        <button id="btnEnableTV">AKTIFKAN SUARA (TEKAN OK)</button>
    </div>

    <!-- Header Section -->
    <header>
        <div class="header-title">
            <h1>Dashboard Pengiriman INVESTAMA KALIMANTAN ENERGI GROUP</h1>
            <p id="targetDate">MENGAMBIL DATA...</p>
        </div>
        <div class="header-controls">
            <div class="audio-control">
                <button class="audio-btn" id="playPauseBtn" onclick="toggleAudio()">▶</button>
                <span id="audio-status" style="font-size: 12px; font-weight: bold;">STOP</span>
            </div>
            <div class="clock-block">
                <div class="clock-time" id="clock">00:00:00</div>
            </div>
        </div>
    </header>

    <!-- Table Container -->
    <div id="scrollContainer">
        <table>
            <thead>
                <tr>
                    <th style="width: 35%;">Unit / Sopir / Lokasi</th>
                    <th style="width: 15%; text-align: center;">Jumlah</th>
                    <th style="width: 30%;">Tujuan Pengiriman / Asal Depo</th>
                    <th style="width: 20%; text-align: right;">Status Pengiriman</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- Quote Overlay -->
    <div id="quoteOverlay">
        <div class="quote-box">
            <div id="quoteText"></div>
            <div id="quoteSource"></div>
        </div>
    </div>

    <audio id="murottalAudio" preload="none"></audio>
    <audio id="fallbackPlayer" preload="auto"></audio>

    <script>
        const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const quotes = [
            { t: "Sesungguhnya sesudah kesulitan itu ada kemudahan.", s: "QS. Al-Insyirah: 6" },
            { t: "Bekerjalah untuk duniamu seolah hidup selamanya,\nberamallah untuk akhiratmu seolah mati besok.", s: "Ali bin Abi Thalib" },
            { t: "Sebaik-baik manusia adalah yang paling bermanfaat bagi orang lain.", s: "HR. Ahmad" }
        ];

        let quoteIndex = 0;
        const audio = document.getElementById('murottalAudio');
        const fallbackPlayer = document.getElementById('fallbackPlayer');
        const streamSources = [
            "https://live.mp3quran.net/makkah",
            "https://live.mp3quran.net/madinah"
        ];
        let currentSourceIndex = 0;
        let previousStatusMap = {};
        let isInitialLoad = true;
        let isAudioAllowed = false;
        let isScrolling = false;
        let scrollRequest = null;
        let audioCtx = null;

        document.addEventListener("DOMContentLoaded", function() {
            const modal = document.getElementById('tvAudioModal');
            const btn = document.getElementById('btnEnableTV');
            if (btn) btn.focus();

            function activateAudio() {
                isAudioAllowed = true;
                if (modal) modal.style.display = 'none';

                // Buka proteksi Web Audio API
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                    audioCtx.resume();
                } catch(e) {}

                // Inisialisasi ResponsiveVoice jika tersedia
                if (window.responsiveVoice) {
                    window.responsiveVoice.init();
                }

                playVoiceAnnouncement("Sistem pengumuman suara telah aktif.");
            }

            if (btn) btn.addEventListener('click', activateAudio);
            document.addEventListener('keydown', function(e) {
                if (e.key === "Enter" && modal && modal.style.display !== 'none') {
                    activateAudio();
                }
            });
        });

        function getWIBDateString() {
            const d = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Jakarta" }));
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // Generator Bel Chime Bandara
        function playAirportChime() {
            return new Promise((resolve) => {
                try {
                    if (!audioCtx) {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        audioCtx = new AudioContext();
                    }
                    if (audioCtx.state === 'suspended') audioCtx.resume();

                    const notes = [
                        { freq: 698.46, time: 0.00, duration: 0.4 }, 
                        { freq: 587.33, time: 0.35, duration: 0.4 }, 
                        { freq: 440.00, time: 0.70, duration: 0.4 }, 
                        { freq: 349.23, time: 1.05, duration: 0.9 }  
                    ];

                    notes.forEach(note => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();

                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(note.freq, audioCtx.currentTime + note.time);
                        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime + note.time);
                        gain.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + note.time + 0.03);
                        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + note.time + note.duration);

                        osc.connect(gain);
                        gain.connect(audioCtx.destination);

                        osc.start(audioCtx.currentTime + note.time);
                        osc.stop(audioCtx.currentTime + note.time + note.duration);
                    });

                    setTimeout(resolve, 2000);
                } catch (e) {
                    resolve();
                }
            });
        }

        // PERBAIKAN UTAMA: SISTEM MULTI-ENGINE TTS
        function playVoiceAnnouncement(text) {
            if (!isAudioAllowed) return;

            const originalVolume = audio.volume;
            if (!audio.paused) audio.volume = 0.1;

            playAirportChime().then(() => {
                const fullText = text + ". Utamakan keselamatan kerja dan gunakan APD saat bertugas.";

                // METODE 1: ResponsiveVoice (Sangat disarankan untuk Smart TV)
                if (window.responsiveVoice && window.responsiveVoice.voiceSupport()) {
                    window.responsiveVoice.speak(fullText, "Indonesian Female", {
                        rate: 0.85,
                        onend: async () => {
                            await playAirportChime();
                            if (!audio.paused) audio.volume = originalVolume;
                        },
                        onerror: () => fallbackTTS(fullText, originalVolume)
                    });
                } else {
                    fallbackTTS(fullText, originalVolume);
                }
            });
        }

        // METODE CADANGAN 2 & 3: Audio Element Streaming Direct
        function fallbackTTS(fullText, originalVolume) {
            const googleUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(fullText)}&tl=id&client=tw-ob`;
            
            fallbackPlayer.src = googleUrl;
            fallbackPlayer.play().then(() => {
                fallbackPlayer.onended = async () => {
                    await playAirportChime();
                    if (!audio.paused) audio.volume = originalVolume;
                };
            }).catch(() => {
                // METODE CADANGAN TERAKHIR: Web Speech API Native
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(fullText);
                    u.lang = 'id-ID';
                    u.onend = async () => {
                        await playAirportChime();
                        if (!audio.paused) audio.volume = originalVolume;
                    };
                    window.speechSynthesis.speak(u);
                } else {
                    if (!audio.paused) audio.volume = originalVolume;
                }
            });
        }

        function toggleAudio() {
            const btn = document.getElementById('playPauseBtn');
            const statusLabel = document.getElementById('audio-status');
            if (audio.paused) { playCurrentSource(); } 
            else { audio.pause(); btn.innerText = "▶"; statusLabel.innerText = "STOP"; }
        }

        function playCurrentSource() {
            const btn = document.getElementById('playPauseBtn');
            const statusLabel = document.getElementById('audio-status');
            statusLabel.innerText = "CONNECTING...";
            audio.src = streamSources[currentSourceIndex];
            audio.play().then(() => {
                btn.innerText = "⏸";
                statusLabel.innerText = "QUR'AN LIVE";
            }).catch(() => tryNextSource());
        }

        function tryNextSource() {
            currentSourceIndex = (currentSourceIndex + 1) % streamSources.length;
            playCurrentSource();
        }

        function wrapText(element) {
            const text = element.textContent;
            element.innerHTML = '';
            text.split(' ').forEach((word) => {
                if (!word) return;
                const wordSpan = document.createElement('span');
                wordSpan.className = 'word-wrapper';
                word.split('').forEach(char => {
                    const wrapper = document.createElement('span');
                    wrapper.className = 'letter-wrapper';
                    const s = document.createElement('span');
                    s.className = 'letter';
                    s.innerHTML = char;
                    wrapper.appendChild(s);
                    wordSpan.appendChild(wrapper);
                });
                element.appendChild(wordSpan);
            });
        }

        async function animateIn(overlay) {
            overlay.style.display = 'flex';
            overlay.offsetHeight;
            overlay.style.opacity = '1';
            const letters = overlay.querySelectorAll('.letter');
            for (let i = 0; i < letters.length; i++) {
                letters[i].classList.remove('out');
                letters[i].classList.add('in');
                if (i % 3 === 0) await new Promise(r => setTimeout(r, 15));
            }
        }

        async function animateOut(overlay) {
            const letters = overlay.querySelectorAll('.letter');
            for (let i = 0; i < letters.length; i++) {
                letters[i].classList.remove('in');
                letters[i].classList.add('out');
                if (i % 4 === 0) await new Promise(r => setTimeout(r, 10));
            }
            overlay.style.opacity = '0';
            await new Promise(r => setTimeout(r, 800));
            overlay.style.display = 'none';
        }

        async function showQuote() {
            const overlay = document.getElementById('quoteOverlay');
            const qTxt = document.getElementById('quoteText');
            const qSrc = document.getElementById('quoteSource');
            const q = quotes[quoteIndex];
            quoteIndex = (quoteIndex + 1) % quotes.length;
            qTxt.textContent = q.t;
            qSrc.textContent = q.s;
            wrapText(qTxt); wrapText(qSrc);
            await animateIn(overlay);
            await new Promise(r => setTimeout(r, 10000)); 
            await animateOut(overlay);
        }

        const scrollContainer = document.getElementById('scrollContainer');
        function stopAutoScroll() {
            if (scrollRequest) { cancelAnimationFrame(scrollRequest); scrollRequest = null; }
            isScrolling = false;
        }

        function startAutoScroll() {
            stopAutoScroll();
            if (scrollContainer.scrollHeight <= scrollContainer.clientHeight) {
                setTimeout(async () => { await showQuote(); loadDashboard(); }, 10000);
                return;
            }

            isScrolling = true;
            const scrollSpeed = 0.6; 
            function step() {
                if (!isScrolling) return;
                const currentPos = scrollContainer.scrollTop + scrollContainer.clientHeight + 2;
                if (currentPos >= scrollContainer.scrollHeight) {
                    stopAutoScroll();
                    setTimeout(async () => {
                        await showQuote(); 
                        scrollContainer.scrollTo({ top: 0, behavior: 'smooth' });
                        setTimeout(() => { loadDashboard(); }, 500); 
                    }, 1000);
                    return; 
                }
                scrollContainer.scrollTop += scrollSpeed;
                scrollRequest = requestAnimationFrame(step);
            }
            setTimeout(() => { if (isScrolling) scrollRequest = requestAnimationFrame(step); }, 3000); 
        }

        function getWIB() { return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Jakarta" })); }

        function announceStatusChange(item, statusType) {
            const nopol = item.nopol || 'Tanpa Nopol';
            const sopir = item.sopir || 'Sopir';
            const tujuan = item.delivery_to || 'Tujuan';

            let teks = "";
            if (statusType.includes("PROSES")) {
                teks = `Mohon perhatian, kendaraan nomor polisi ${nopol}. Driver ${sopir}, tujuan ${tujuan}, status PROSES.`;
            } else if (statusType.includes("DELIVERED")) {
                teks = `Mohon perhatian, kendaraan nomor polisi ${nopol}. Driver ${sopir}, tujuan ${tujuan}, status DELIVERED.`;
            }

            if (teks) playVoiceAnnouncement(teks);
        }

        async function loadDashboard() {
            try {
                const hariIni = getWIB();
                const isoHariIni = getWIBDateString();
                document.getElementById('targetDate').innerText = hariIni.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();

                const { data, error } = await _supabase.from('data_pengiriman').select('*').gte('tanggal', isoHariIni);
                if (error) throw error;
                
                const currentData = data || [];
                currentData.forEach(item => {
                    const id = item.id || (item.sopir + '_' + item.tanggal + '_' + item.delivery_to);
                    const statusBaru = (item.status || "").toUpperCase();
                    if (!isInitialLoad && item.tanggal === isoHariIni) {
                        const statusLama = previousStatusMap[id];
                        if (statusBaru.includes("PROSES") && statusLama && !statusLama.includes("PROSES")) {
                            announceStatusChange(item, "PROSES");
                        } else if (statusBaru.includes("DELIVERED") && statusLama && !statusLama.includes("DELIVERED")) {
                            announceStatusChange(item, "DELIVERED");
                        }
                    }
                    previousStatusMap[id] = statusBaru;
                });

                isInitialLoad = false;
                renderData(currentData);
            } catch (err) { 
                startAutoScroll();
            }
        }

        function setupRealtimeListener() {
            _supabase.channel('realtime_pengiriman')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'data_pengiriman' }, (payload) => {
                    if (payload.eventType === 'UPDATE' || payload.eventType === 'INSERT') {
                        const item = payload.new;
                        const isoHariIni = getWIBDateString();
                        const id = item.id || (item.sopir + '_' + item.tanggal + '_' + item.delivery_to);
                        const statusBaru = (item.status || "").toUpperCase();
                        const statusLama = previousStatusMap[id];

                        if (item.tanggal === isoHariIni) {
                            if (statusBaru.includes("PROSES") && statusLama && !statusLama.includes("PROSES")) {
                                announceStatusChange(item, "PROSES");
                            } else if (statusBaru.includes("DELIVERED") && statusLama && !statusLama.includes("DELIVERED")) {
                                announceStatusChange(item, "DELIVERED");
                            }
                        }
                        previousStatusMap[id] = statusBaru;
                    }
                    loadDashboard();
                }).subscribe();
        }

        async function renderData(data) {
            stopAutoScroll();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            const priority = { "PROSES": 1, "LANGSIR": 2, "TERJADWAL": 3, "OPER": 4, "NGISI": 5, "TUNGGU": 6, "DELIVERED": 7 };
            data.sort((a, b) => {
                if(a.tanggal !== b.tanggal) return a.tanggal.localeCompare(b.tanggal);
                return (priority[a.status?.toUpperCase()] || 99) - (priority[b.status?.toUpperCase()] || 99);
            });

            let currentTanggal = "";
            for (let row of data) {
                if (row.tanggal !== currentTanggal) {
                    currentTanggal = row.tanggal;
                    const [yyyy, mm, dd] = currentTanggal.split('-');
                    const dateObj = new Date(yyyy, mm - 1, dd);
                    const dateStr = dateObj.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();
                    
                    const divider = document.createElement('tr');
                    divider.innerHTML = `<td colspan="4" class="date-divider">${dateStr}</td>`;
                    tbody.appendChild(divider);
                }

                const tr = document.createElement('tr');
                const st = (row.status || "").toUpperCase();
                
                let cls = "st-terjadwal";
                if (st.includes("PROSES")) cls = "st-proses";
                else if (st.includes("LANGSIR")) cls = "st-langsir";
                else if (st.includes("OPER")) cls = "st-oper";
                else if (st.includes("TUNGGU")) cls = "st-tunggu";
                else if (st.includes("NGISI")) cls = "st-ngisi";
                else if (st.includes("DELIVERED")) cls = "st-delivered";

                tr.innerHTML = `
                    <td>
                        <div class="flight-cell">
                            <div class="nopol-block">${row.nopol || '-'}</div>
                            <div class="sopir-name">${row.sopir || '-'}</div>
                        </div>
                        <div style="font-size:15px; color:var(--text-blue-soft); margin-left:2px;">LOCATION : ${row.lokasi || '-'}</div>
                    </td>
                    <td style="text-align:center; font-weight:bold; color:var(--text-gold-soft); font-size:18px;">${row.jumlah_keluar || '0'}</td>
                    <td>
                        <div style="color:var(--text-white-soft); font-weight:bold; font-size:16px; margin-bottom:4px;">${row.delivery_to || '-'}</div>
                        <div style="color:var(--text-blue-soft); font-size:14px; font-weight:600; text-transform:uppercase;">DEPO : ${row.supplier || '-'}</div>
                    </td>
                    <td class="${cls}" style="text-align:right; font-size:16px; font-weight:bold; letter-spacing:1px;">${st}</td>
                `;
                tbody.appendChild(tr);
            }

            scrollContainer.scrollTop = 0;
            startAutoScroll();
        }

        setInterval(() => {
            const now = getWIB();
            document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        loadDashboard();
        setupRealtimeListener();
    </script>
</body>
</html>
