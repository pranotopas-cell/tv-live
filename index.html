<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pengiriman - Android TV</title>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- ResponsiveVoice untuk TTS Opsional -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=YOUR_KEY"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --text-blue-soft: #93c5fd;
            --text-gold-soft: #fde047;
            --text-white-soft: #f3f4f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Banner Aktivasi Audio Pertama Kali */
        #audioEnableBanner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #audioEnableBanner h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #60a5fa;
        }

        #audioEnableBanner p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            max-width: 600px;
        }

        #audioEnableBanner button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: background 0.3s;
        }

        #audioEnableBanner button:hover {
            background: #1d4ed8;
        }

        /* Header Dashboard */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .header-title h1 {
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .header-title p {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #clock {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-gold-soft);
        }

        .audio-ctrl {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .audio-ctrl button {
            background: transparent;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* Container Utama Tabel */
        .main-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 40px;
            scroll-behavior: smooth;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: rgba(30, 41, 59, 0.8);
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            padding: 15px;
            text-align: left;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            background: var(--card-bg);
        }

        .date-divider {
            background: transparent !important;
            color: var(--text-gold-soft);
            font-weight: bold;
            font-size: 1.1rem;
            padding-top: 25px !important;
            padding-bottom: 10px !important;
            border: none !important;
            letter-spacing: 1px;
        }

        .flight-cell {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 5px;
        }

        .nopol-block {
            background: #1e3a8a;
            color: #93c5fd;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .sopir-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-white-soft);
        }

        /* Status Badges */
        .st-proses { color: #facc15; }
        .st-langsir { color: #38bdf8; }
        .st-terjadwal { color: #94a3b8; }
        .st-oper { color: #fb923c; }
        .st-ngisi { color: #c084fc; }
        .st-tunggu { color: #f87171; }
        .st-delivered { color: #4ade80; }

        /* Quotes Overlay */
        #quoteOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.96);
            z-index: 999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .quote-content {
            max-width: 900px;
        }

        .quote-text {
            font-size: 2.2rem;
            line-height: 1.5;
            color: var(--text-white-soft);
            margin-bottom: 20px;
            font-style: italic;
        }

        .quote-source {
            font-size: 1.3rem;
            color: var(--text-gold-soft);
            letter-spacing: 2px;
        }

        /* Animasi Surat/Huruf */
        .word-wrapper { display: inline-block; white-space: nowrap; margin-right: 0.3em; }
        .letter-wrapper { display: inline-block; overflow: hidden; }
        .letter {
            display: inline-block;
            transform: translateY(100%);
            opacity: 0;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }
        .letter.in { transform: translateY(0%); opacity: 1; }
        .letter.out { transform: translateY(-100%); opacity: 0; }
    </style>
</head>
<body>

    <!-- Banner Interaksi Pertama (Wajib untuk Autoplay Audio & TTS di TV/Browser) -->
    <div id="audioEnableBanner">
        <h1>DASHBOARD PENGIRIMAN</h1>
        <p>Tekan tombol di bawah untuk mengaktifkan sistem suara pengumuman dan murottal secara otomatis.</p>
        <button onclick="enableAudioSystem()">MULAI DASHBOARD</button>
    </div>

    <!-- Header -->
    <header>
        <div class="header-title">
            <h1 id="targetDate">MEMUAT TANGGAL...</h1>
            <p>Sistem Pemantauan Pengiriman Real-Time</p>
        </div>
        <div class="header-right">
            <div class="audio-ctrl">
                <span id="audio-status" style="font-size:0.9rem; color:var(--text-muted)">BERHENTI</span>
                <button id="playPauseBtn" onclick="toggleAudio()">▶</button>
            </div>
            <div id="clock">00:00:00</div>
        </div>
    </header>

    <!-- Main Content Table -->
    <div class="main-container" id="scrollContainer">
        <table>
            <thead>
                <tr>
                    <th style="width: 40%;">ARMADA / SOPIR / LOKASI</th>
                    <th style="width: 15%; text-align: center;">JUMLAH</th>
                    <th style="width: 30%;">TUJUAN / DEPO</th>
                    <th style="width: 15%; text-align: right;">STATUS</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data dimasukkan secara dinamis lewat JS -->
            </tbody>
        </table>
    </div>

    <!-- Quote Overlay -->
    <div id="quoteOverlay">
        <div class="quote-content">
            <div class="quote-text" id="quoteText"></div>
            <div class="quote-source" id="quoteSource"></div>
        </div>
    </div>

    <!-- Audio Element untuk Murottal/Radio Stream -->
    <audio id="murottalAudio" preload="none"></audio>

    <!-- JavaScript Logika & Perbaikan Artikulasinya -->
    <script>
        const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const quotes = [
            { t: "Sesungguhnya sesudah kesulitan itu ada kemudahan.", s: "QS. Al-Insyirah: 6" },
            { t: "Bekerjalah untuk duniamu seolah hidup selamanya,\nberamallah untuk akhiratmu seolah mati besok.", s: "Ali bin Abi Thalib" },
            { t: "Sebaik-baik manusia adalah yang paling bermanfaat bagi orang lain.", s: "HR. Ahmad" }
        ];

        let quoteIndex = 0;
        const audio = document.getElementById('murottalAudio');
        const streamSources = [
            "https://live.mp3quran.net/makkah",
            "https://live.mp3quran.net/madinah",
            "https://qurango.net/radio/mix"
        ];
        let currentSourceIndex = 0;

        let previousStatusMap = {};
        let isInitialLoad = true;
        let isAudioAllowed = false;
        let isScrolling = false;
        let scrollRequest = null;

        function getWIBDateString() {
            const d = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Jakarta" }));
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        // Chime nada ding-dong ala bandara
        function playAirportChime() {
            return new Promise((resolve) => {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContext) {
                        resolve();
                        return;
                    }
                    const ctx = new AudioContext();

                    const notes = [
                        { freq: 523.25, time: 0, duration: 0.8 },
                        { freq: 392.00, time: 0.5, duration: 1.2 }
                    ];

                    notes.forEach(note => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();

                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(note.freq, ctx.currentTime + note.time);

                        gain.gain.setValueAtTime(0.001, ctx.currentTime + note.time);
                        gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + note.time + 0.05);
                        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + note.time + note.duration);

                        osc.connect(gain);
                        gain.connect(ctx.destination);

                        osc.start(ctx.currentTime + note.time);
                        osc.stop(ctx.currentTime + note.time + note.duration);
                    });

                    setTimeout(() => {
                        ctx.close();
                        resolve();
                    }, 1700);
                } catch (e) {
                    console.error("Gagal memutar chime:", e);
                    resolve();
                }
            });
        }

        // Format teks agar artikulasi Speech Synthesis jelas di Android TV
        function formatTextForSpeech(text) {
            if (!text) return "";
            return text
                .toString()
                .trim()
                .replace(/-/g, " ")
                .replace(/_/g, " ")
                .replace(/\s+/g, " ");
        }

        // Fungsi Pengumuman Suara Terbaca Jelas & Teroptimasi
        async function playVoiceAnnouncement(text) {
            if (!isAudioAllowed) return;

            const originalVolume = audio.volume;
            if (!audio.paused) audio.volume = 0.1;

            await playAirportChime();

            const cleanText = formatTextForSpeech(text);
            const safetyMessage = " Tetap jaga kualitas dan kuantitas, serta selalu utamakan penggunaan alat pelindung diri atau keselamatan kerja.";
            const fullText = cleanText + safetyMessage;

            // Fallback Web Speech API dengan pemilihan Voice Engine terbaik untuk Android TV
            const speakFallback = () => {
                if (!('speechSynthesis' in window)) return;

                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(fullText);
                msg.lang = 'id-ID';
                msg.rate = 0.85; // Dipelankan agar artikulasi kata di Android TV lebih jelas
                msg.pitch = 1.0;

                const voices = window.speechSynthesis.getVoices();
                const bestVoice = voices.find(v => v.lang.includes('id') && (v.name.includes('Google') || v.name.includes('Indonesian') || v.name.includes('Android')));
                
                if (bestVoice) {
                    msg.voice = bestVoice;
                }

                msg.onend = () => { if (!audio.paused) audio.volume = originalVolume; };
                msg.onerror = () => { if (!audio.paused) audio.volume = originalVolume; };

                window.speechSynthesis.speak(msg);
            };

            if (window.responsiveVoice && typeof responsiveVoice.speak === 'function') {
                try {
                    responsiveVoice.speak(fullText, "Indonesian Female", {
                        pitch: 1,
                        rate: 0.85,
                        volume: 1,
                        onend: () => { if (!audio.paused) audio.volume = originalVolume; },
                        onerror: () => speakFallback()
                    });
                } catch (e) {
                    speakFallback();
                }
            } else {
                speakFallback();
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        function enableAudioSystem() {
            isAudioAllowed = true;
            document.getElementById('audioEnableBanner').style.display = 'none';
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
            }
            
            playVoiceAnnouncement("Sistem pengumuman suara telah aktif.");
        }

        function toggleAudio() {
            const btn = document.getElementById('playPauseBtn');
            const statusLabel = document.getElementById('audio-status');
            if (audio.paused) { playCurrentSource(); } 
            else { audio.pause(); btn.innerText = "▶"; statusLabel.innerText = "BERHENTI"; }
        }

        function playCurrentSource() {
            const btn = document.getElementById('playPauseBtn');
            const statusLabel = document.getElementById('audio-status');
            statusLabel.innerText = "MENGHUBUNGKAN...";
            audio.src = streamSources[currentSourceIndex];
            audio.play().then(() => {
                btn.innerText = "⏸";
                statusLabel.innerText = "QUR'AN LIVE";
            }).catch(() => tryNextSource());
        }

        function tryNextSource() {
            currentSourceIndex = (currentSourceIndex + 1) % streamSources.length;
            playCurrentSource();
        }

        function wrapText(element) {
            const text = element.textContent;
            element.innerHTML = '';
            const words = text.split(' ');
            words.forEach((word) => {
                if (!word) return;
                const wordSpan = document.createElement('span');
                wordSpan.className = 'word-wrapper';
                word.split('').forEach(char => {
                    const wrapper = document.createElement('span');
                    wrapper.className = 'letter-wrapper';
                    const s = document.createElement('span');
                    s.className = 'letter';
                    s.innerHTML = char;
                    wrapper.appendChild(s);
                    wordSpan.appendChild(wrapper);
                });
                element.appendChild(wordSpan);
            });
        }

        async function animateIn(overlay) {
            overlay.style.display = 'flex';
            overlay.offsetHeight;
            overlay.style.opacity = '1';
            const letters = overlay.querySelectorAll('.letter');
            for (let i = 0; i < letters.length; i++) {
                letters[i].classList.remove('out');
                letters[i].classList.add('in');
                if (i % 3 === 0) await new Promise(r => setTimeout(r, 15));
            }
        }

        async function animateOut(overlay) {
            const letters = overlay.querySelectorAll('.letter');
            for (let i = 0; i < letters.length; i++) {
                letters[i].classList.remove('in');
                letters[i].classList.add('out');
                if (i % 4 === 0) await new Promise(r => setTimeout(r, 10));
            }
            overlay.style.opacity = '0';
            await new Promise(r => setTimeout(r, 800));
            overlay.style.display = 'none';
        }

        async function showQuote() {
            const overlay = document.getElementById('quoteOverlay');
            const qTxt = document.getElementById('quoteText');
            const qSrc = document.getElementById('quoteSource');
            
            const q = quotes[quoteIndex];
            quoteIndex = (quoteIndex + 1) % quotes.length;

            qTxt.textContent = q.t;
            qSrc.textContent = q.s;
            
            wrapText(qTxt);
            wrapText(qSrc);
            
            await animateIn(overlay);
            await new Promise(r => setTimeout(r, 7000)); 
            await animateOut(overlay);
        }

        const scrollContainer = document.getElementById('scrollContainer');
        
        function stopAutoScroll() {
            if (scrollRequest) {
                cancelAnimationFrame(scrollRequest);
                scrollRequest = null;
            }
            isScrolling = false;
        }

        function startAutoScroll() {
            stopAutoScroll();

            if (scrollContainer.scrollHeight <= scrollContainer.clientHeight) {
                setTimeout(async () => {
                    await showQuote();
                    loadDashboard();
                }, 10000);
                return;
            }

            isScrolling = true;
            const scrollSpeed = 0.8; 

            function step() {
                if (!isScrolling) return;

                const currentPos = scrollContainer.scrollTop + scrollContainer.clientHeight + 2;
                const maxPos = scrollContainer.scrollHeight;

                if (currentPos >= maxPos) {
                    stopAutoScroll();
                    setTimeout(async () => {
                        await showQuote(); 
                        scrollContainer.scrollTo({ top: 0, behavior: 'smooth' });
                        setTimeout(() => { 
                            loadDashboard(); 
                        }, 500); 
                    }, 1000);
                    return; 
                }

                scrollContainer.scrollTop += scrollSpeed;
                scrollRequest = requestAnimationFrame(step);
            }

            setTimeout(() => { 
                if (isScrolling) {
                    scrollRequest = requestAnimationFrame(step); 
                }
            }, 3000); 
        }

        function getWIB() { return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Jakarta" })); }

        function announceStatusChange(item, statusBaru) {
            const sopir = formatTextForSpeech(item.sopir || 'Pengemudi');
            const tujuan = formatTextForSpeech(item.delivery_to || 'Tujuan');
            const status = formatTextForSpeech(statusBaru);
            
            const teks = `Pemberitahuan. Pengemudi ${sopir}, dengan tujuan ${tujuan}, status pengiriman saat ini ${status}.`;
            playVoiceAnnouncement(teks);
        }

        async function loadDashboard() {
            try {
                const hariIni = getWIB();
                const isoHariIni = getWIBDateString();
                document.getElementById('targetDate').innerText = hariIni.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();

                const { data, error } = await _supabase.from('data_pengiriman').select('*').gte('tanggal', isoHariIni);
                if (error) throw error;
                
                const currentData = data || [];

                currentData.forEach(item => {
                    const id = item.id || (item.sopir + '_' + item.tanggal + '_' + item.delivery_to);
                    const statusBaru = (item.status || "").toUpperCase();
                    const isHariIni = (item.tanggal === isoHariIni);

                    if (!isInitialLoad && isHariIni) {
                        const statusLama = previousStatusMap[id];
                        if (statusLama && statusLama !== statusBaru) {
                            announceStatusChange(item, statusBaru);
                        }
                    }
                    previousStatusMap[id] = statusBaru;
                });

                isInitialLoad = false;
                renderData(currentData);
            } catch (err) { 
                console.error("Gagal:", err.message); 
                startAutoScroll();
            }
        }

        function setupRealtimeListener() {
            _supabase
                .channel('realtime_pengiriman')
                .on(
                    'postgres_changes',
                    { event: '*', schema: 'public', table: 'data_pengiriman' },
                    (payload) => {
                        if (payload.eventType === 'UPDATE' || payload.eventType === 'INSERT') {
                            const item = payload.new;
                            const isoHariIni = getWIBDateString();
                            const id = item.id || (item.sopir + '_' + item.tanggal + '_' + item.delivery_to);
                            const statusBaru = (item.status || "").toUpperCase();
                            const statusLama = previousStatusMap[id];

                            if (item.tanggal === isoHariIni) {
                                if (statusLama && statusLama !== statusBaru) {
                                    announceStatusChange(item, statusBaru);
                                }
                            }
                            previousStatusMap[id] = statusBaru;
                        }
                        loadDashboard();
                    }
                )
                .subscribe();
        }

        async function renderData(data) {
            stopAutoScroll();

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            const priority = { "PROSES": 1, "LANGSIR": 2, "TERJADWAL": 3, "OPER": 4, "NGISI": 5, "TUNGGU": 6, "DELIVERED": 7 };

            data.sort((a, b) => {
                if(a.tanggal !== b.tanggal) return a.tanggal.localeCompare(b.tanggal);
                return (priority[a.status?.toUpperCase().trim()] || 99) - (priority[b.status?.toUpperCase().trim()] || 99);
            });

            let currentTanggal = "";
            for (let row of data) {
                if (row.tanggal !== currentTanggal) {
                    currentTanggal = row.tanggal;
                    const [yyyy, mm, dd] = currentTanggal.split('-');
                    const dateObj = new Date(yyyy, mm - 1, dd);
                    const dateStr = dateObj.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();
                    
                    const divider = document.createElement('tr');
                    divider.innerHTML = `<td colspan="4" class="date-divider">${dateStr} </td>`;
                    tbody.appendChild(divider);
                }

                const tr = document.createElement('tr');
                const st = (row.status || "").toUpperCase().trim();
                
                let cls = "st-terjadwal";
                if (st.includes("PROSES")) cls = "st-proses";
                else if (st.includes("LANGSIR")) cls = "st-langsir";
                else if (st.includes("OPER")) cls = "st-oper";
                else if (st.includes("TUNGGU")) cls = "st-tunggu";
                else if (st.includes("NGISI")) cls = "st-ngisi";
                else if (st.includes("DELIVERED")) cls = "st-delivered";

                tr.innerHTML = `
                    <td>
                        <div class="flight-cell">
                            <div class="nopol-block">${row.nopol || '-'}</div>
                            <div class="sopir-name">${row.sopir || '-'}</div>
                        </div>
                        <div style="font-size:15px; color:var(--text-blue-soft); margin-left:2px;">LOKASI : ${row.lokasi || '-'}</div>
                    </td>
                    <td style="text-align:center; font-weight:bold; color:var(--text-gold-soft); font-size:18px;">${row.jumlah_keluar || '0'}</td>
                    <td>
                        <div style="color:var(--text-white-soft); font-weight:bold; font-size:16px; margin-bottom:4px;">${row.delivery_to || '-'}</div>
                        <div style="color:var(--text-blue-soft); font-size:14px; font-weight:600; text-transform:uppercase;">DEPO : ${row.supplier || '-'}</div>
                    </td>
                    <td class="${cls}" style="text-align:right; font-size:16px; font-weight:bold; letter-spacing:1px;">${st}</td>
                `;
                tbody.appendChild(tr);
            }

            scrollContainer.scrollTop = 0;
            startAutoScroll();
        }

        setInterval(() => {
            const now = getWIB();
            document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        loadDashboard();
        setupRealtimeListener();
    </script>
</body>
</html>
